<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tracker</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#000;color:#f5f5f5;font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
main{width:min(100% - 32px,720px);margin:0 auto;padding:28px 0}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
h1{font-size:19px;font-weight:600;margin:0}
button{border:1px solid #333;background:#000;color:#f5f5f5;padding:7px 12px;border-radius:5px;cursor:pointer;font:inherit}
button:hover{border-color:#666}
#lists{display:flex;flex-direction:column;gap:30px}
.list{border-top:1px solid #222}
.list-head{display:flex;align-items:center;gap:8px;padding:9px 0}
.lock,.remove{border:0;padding:3px 5px;color:#888;background:transparent;font-size:15px}
.lock:hover,.remove:hover{color:#fff}
.list-name{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#f5f5f5;font:600 17px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.list-name::selection{background:#333}
.row{display:flex;align-items:center;gap:9px;min-height:43px;border-bottom:1px solid #181818;padding:7px 0}
.row input[type="checkbox"]{width:17px;height:17px;accent-color:#fff;flex:none}
.timestamp{width:148px;flex:none;color:#888;font-size:13px;user-select:none;white-space:nowrap}
.note{display:block;width:min(100%,380px);min-height:26px;max-height:160px;resize:none;overflow:hidden;border:0;outline:0;border-bottom:1px solid #171717;background:transparent;color:#f5f5f5;font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:3px 0}
.note::placeholder{color:#444}
.row.locked .note{color:#aaa}
.empty{color:#555;padding:10px 0}
@media(max-width:600px){.timestamp{width:125px;font-size:12px}.note{width:min(100%,260px)}}
</style>
</head>
<body>
<main>
<header>
<h1>Tracker</h1>
<button id="add">Add</button>
</header>
<div id="lists"></div>
</main>

<script>
const KEY="tracker-reset-v3";
let lists=[];

try{lists=JSON.parse(localStorage.getItem(KEY)||"[]")}catch{lists=[]}

function persist(){localStorage.setItem(KEY,JSON.stringify(lists))}

function rows(){
  return Array.from({length:11},()=>({
    id:crypto.randomUUID(),checked:false,time:"",note:""
  }));
}

function createList(){
  const list={id:crypto.randomUUID(),name:"New List",unlocked:true,rows:rows()};
  lists.push(list);
  persist();
  render();
  const names=document.querySelectorAll(".list-name");
  names[names.length-1].focus();
  names[names.length-1].select();
}

function resize(textarea){
  textarea.style.height="auto";
  textarea.style.height=Math.min(textarea.scrollHeight,160)+"px";
}

function toggleRow(list,row,index){
  if(!list.unlocked)return;

  row.checked=!row.checked;
  row.time=new Date().toLocaleString();

  // Always keep one empty row at the bottom.
  if(row.checked && index===list.rows.length-1){
    list.rows.push({id:crypto.randomUUID(),checked:false,time:"",note:""});
  }

  persist();
  render();
}

function render(){
  const container=document.getElementById("lists");
  container.innerHTML="";

  if(!lists.length){
    container.innerHTML='<div class="empty">No lists</div>';
    return;
  }

  lists.forEach(list=>{
    const box=document.createElement("section");
    box.className="list";

    const head=document.createElement("div");
    head.className="list-head";

    const lock=document.createElement("button");
    lock.className="lock";
    lock.type="button";
    lock.title=list.unlocked?"Lock checking":"Unlock checking";
    lock.textContent=list.unlocked?"🔓":"🔒";
    lock.onclick=()=>{
      list.unlocked=!list.unlocked;
      persist();
      render();
    };

    const name=document.createElement("input");
    name.className="list-name";
    name.type="text";
    name.value=list.name;
    name.title="Click to rename";
    name.addEventListener("input",()=>{list.name=name.value;persist()});
    name.addEventListener("keydown",e=>{if(e.key==="Enter")name.blur()});

    const remove=document.createElement("button");
    remove.className="remove";
    remove.type="button";
    remove.title="Remove list";
    remove.textContent="×";
    remove.onclick=()=>{
      if(confirm("Remove this list?")){
        lists=lists.filter(x=>x.id!==list.id);
        persist();
        render();
      }
    };

    head.append(lock,name,remove);
    box.appendChild(head);

    list.rows.forEach((row,index)=>{
      const el=document.createElement("div");
      el.className="row"+(!list.unlocked?" locked":"");

      const checkbox=document.createElement("input");
      checkbox.type="checkbox";
      checkbox.checked=row.checked;
      checkbox.disabled=!list.unlocked;
      checkbox.addEventListener("change",()=>toggleRow(list,row,index));

      const timestamp=document.createElement("span");
      timestamp.className="timestamp";
      timestamp.textContent=row.time||"";

      const note=document.createElement("textarea");
      note.className="note";
      note.rows=1;
      note.value=row.note;
      note.placeholder="Note";
      note.addEventListener("input",()=>{
        row.note=note.value;
        resize(note);
        persist();
      });

      el.append(checkbox,timestamp,note);
      box.appendChild(el);
      resize(note);
    });

    container.appendChild(box);
  });
}

document.getElementById("add").onclick=createList;
render();
</script>
</body>
</html>
