<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checklist</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#000;color:#f5f5f5;font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
main{max-width:760px;margin:0 auto;padding:28px 18px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
h1{font-size:19px;font-weight:600;margin:0}
button{border:1px solid #333;background:#000;color:#f5f5f5;padding:7px 12px;border-radius:5px;cursor:pointer;font:inherit}
button:hover{border-color:#666}
#lists{display:flex;flex-direction:column;gap:34px}
.list{border-top:1px solid #222}
.list-name{display:block;width:100%;padding:13px 0 9px;border:0;outline:0;background:transparent;color:#f5f5f5;font:600 17px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:text}
.row{display:flex;align-items:center;gap:10px;min-height:45px;border-bottom:1px solid #1c1c1c;padding:8px 0}
.row input[type="checkbox"]{width:17px;height:17px;accent-color:#fff;flex:none}
.row input[type="text"]{border:0;outline:0;flex:1;background:transparent;color:#f5f5f5;font:inherit;min-width:0}
.row input[type="text"]::placeholder{color:#555}
.timestamp{width:170px;flex:none;color:#aaa;user-select:none}
.row.done .note{color:#aaa}
.empty{color:#555;padding:10px 0}
</style>
</head>
<body>
<main>
<header>
<h1>Checklist</h1>
<button id="add">Add</button>
</header>
<div id="lists"></div>
</main>

<script>
const KEY="simple-checklist-v2";
let lists=[];

try{
  lists=JSON.parse(localStorage.getItem(KEY)||"[]");
}catch{
  lists=[];
}

function persist(){
  localStorage.setItem(KEY,JSON.stringify(lists));
}

function newRows(){
  return Array.from({length:11},()=>({id:crypto.randomUUID(),checked:false,time:"",note:""}));
}

function createList(){
  const list={
    id:crypto.randomUUID(),
    name:"New List",
    rows:newRows()
  };
  lists.push(list);
  persist();
  render();
  const names=document.querySelectorAll(".list-name");
  names[names.length-1].focus();
  names[names.length-1].select();
}

function render(){
  const container=document.getElementById("lists");
  container.innerHTML="";

  if(!lists.length){
    container.innerHTML='<div class="empty">No lists</div>';
    return;
  }

  lists.forEach(list=>{
    const box=document.createElement("section");
    box.className="list";

    const name=document.createElement("input");
    name.className="list-name";
    name.type="text";
    name.value=list.name;
    name.setAttribute("aria-label","List name");
    name.addEventListener("input",()=>{
      list.name=name.value;
      persist();
    });
    name.addEventListener("keydown",e=>{
      if(e.key==="Enter")name.blur();
    });

    box.appendChild(name);

    list.rows.forEach((row,index)=>{
      const el=document.createElement("div");
      el.className="row"+(row.checked?" done":"");

      const checkbox=document.createElement("input");
      checkbox.type="checkbox";
      checkbox.checked=row.checked;

      const timestamp=document.createElement("span");
      timestamp.className="timestamp";
      timestamp.textContent=row.checked?row.time:"";

      const note=document.createElement("input");
      note.className="note";
      note.type="text";
      note.value=row.note;
      note.placeholder="Note";
      note.addEventListener("input",()=>{
        row.note=note.value;
        persist();
      });

      checkbox.addEventListener("change",()=>{
        if(!checkbox.checked)return;
        row.checked=true;
        row.time=new Date().toLocaleString();
        timestamp.textContent=row.time;
        checkbox.disabled=true;
        el.classList.add("done");

        // The final empty checkbox always remains available.
        if(index===list.rows.length-1){
          list.rows.push({
            id:crypto.randomUUID(),
            checked:false,
            time:"",
            note:""
          });
        }

        persist();
        render();

        // Put the cursor in the note belonging to the newly completed row.
        const allLists=document.querySelectorAll(".list");
        const current=allLists[lists.indexOf(list)];
        if(current){
          const notes=current.querySelectorAll(".note");
          if(notes[index])notes[index].focus();
        }
      });

      if(row.checked)checkbox.disabled=true;

      el.appendChild(checkbox);
      el.appendChild(timestamp);
      el.appendChild(note);
      box.appendChild(el);
    });

    container.appendChild(box);
  });
}

document.getElementById("add").addEventListener("click",createList);
render();
</script>
</body>
</html>
