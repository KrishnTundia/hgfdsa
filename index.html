<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checklist</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#000;color:#f5f5f5;font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
main{max-width:720px;margin:0 auto;padding:28px 18px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
h1{font-size:19px;font-weight:600;margin:0}
button{border:1px solid #333;background:#000;color:#f5f5f5;padding:7px 12px;border-radius:5px;cursor:pointer;font:inherit}
button:hover{border-color:#666}
#list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;min-height:45px;border-bottom:1px solid #1c1c1c;padding:9px 0}
.row input[type="checkbox"]{width:17px;height:17px;accent-color:#fff;flex:none}
.row input[type="text"]{border:0;outline:0;flex:1;background:transparent;color:#f5f5f5;font:inherit;min-width:0}
.row input[type="text"]::placeholder{color:#666}
.time{flex:1;color:#aaa}
.empty{color:#555;padding:10px 0}
</style>
</head>
<body>
<main>
<header>
<h1>Checklist</h1>
<button id="add">Add</button>
</header>
<div id="list"></div>
</main>
<script>
const KEY="simple-checklist-v1";
let items=[];
try{items=JSON.parse(localStorage.getItem(KEY)||"[]")}catch{items=[]}

function save(){
  localStorage.setItem(KEY,JSON.stringify(items));
  render();
}

function render(){
  const list=document.getElementById("list");
  list.innerHTML="";
  if(!items.length){
    list.innerHTML='<div class="empty">No items</div>';
    return;
  }

  items.forEach(item=>{
    const row=document.createElement("div");
    row.className="row";

    if(item.time){
      const time=document.createElement("span");
      time.className="time";
      time.textContent=item.text+" — "+item.time;
      row.appendChild(time);
    }else{
      const checkbox=document.createElement("input");
      checkbox.type="checkbox";
      checkbox.addEventListener("change",()=>{
        if(checkbox.checked){
          item.time=new Date().toLocaleString();
          save();
        }
      });

      const input=document.createElement("input");
      input.type="text";
      input.value=item.text;
      input.placeholder="Note";
      input.addEventListener("input",()=>{
        item.text=input.value;
        localStorage.setItem(KEY,JSON.stringify(items));
      });

      row.appendChild(checkbox);
      row.appendChild(input);
    }

    list.appendChild(row);
  });
}

document.getElementById("add").onclick=()=>{
  items.push({id:crypto.randomUUID(),text:"",time:null});
  save();
  const inputs=document.querySelectorAll('#list input[type="text"]');
  if(inputs.length)inputs[inputs.length-1].focus();
};

render();
</script>
</body>
</html>
